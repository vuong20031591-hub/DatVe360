<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card gradients for 3D effect -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardTopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- Security glow -->
    <filter id="securityGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle with gradient -->
  <circle cx="150" cy="150" r="140" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
  
  <!-- Credit Card with 3D effect -->
  <g id="creditCard" filter="url(#cardShadow)">
    <rect x="80" y="120" width="140" height="90" rx="12" fill="url(#cardGradient)" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="80" y="120" width="140" height="25" rx="12" fill="url(#cardTopGradient)"/>
    <rect x="80" y="145" width="140" height="65" rx="0" fill="url(#cardGradient)"/>

    <!-- Card flip animation -->
    <animateTransform attributeName="transform" type="rotateY"
                      values="0; 5; 0" dur="4s" repeatCount="indefinite"/>
  </g>
  
  <!-- Card Details -->
  <rect x="90" y="155" width="40" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="90" y="170" width="60" height="6" rx="1" fill="#E5E7EB"/>
  <rect x="90" y="180" width="50" height="6" rx="1" fill="#E5E7EB"/>
  
  <!-- Card Chip -->
  <rect x="170" y="155" width="15" height="12" rx="2" fill="#F59E0B"/>
  <rect x="172" y="157" width="11" height="8" rx="1" fill="#FEF3C7"/>
  
  <!-- Card Number -->
  <text x="90" y="200" fill="#6B7280" font-size="8" font-family="monospace">**** **** **** 1234</text>
  
  <!-- Security Shield with glow -->
  <g id="securityShield" transform="translate(200, 80)" filter="url(#securityGlow)">
    <path d="M15 0 L25 5 L25 20 L15 30 L5 20 L5 5 Z" fill="#10B981" opacity="0.9"/>
    <path d="M15 8 L20 13 L15 18 L10 13 Z" fill="white"/>
    <circle cx="15" cy="13" r="2" fill="#10B981"/>

    <!-- Pulsing animation -->
    <animateTransform attributeName="transform" type="scale"
                      values="1; 1.1; 1" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Mobile Payment -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="35" height="60" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="3" y="8" width="29" height="44" rx="2" fill="#F9FAFB"/>
    
    <!-- Payment Icon -->
    <circle cx="17.5" cy="25" r="8" fill="#10B981" opacity="0.2"/>
    <path d="M13 25 L16 28 L22 22" stroke="#10B981" stroke-width="2" fill="none"/>
    
    <!-- Payment Amount -->
    <text x="17.5" y="40" text-anchor="middle" fill="#10B981" font-size="6" font-family="Arial">1.200.000đ</text>
  </g>
  
  <!-- Payment Methods -->
  <g transform="translate(100, 240)">
    <!-- Visa -->
    <rect x="0" y="0" width="25" height="15" rx="3" fill="#1A1F71"/>
    <text x="12.5" y="10" text-anchor="middle" fill="white" font-size="6" font-family="Arial">VISA</text>
    
    <!-- Mastercard -->
    <rect x="30" y="0" width="25" height="15" rx="3" fill="#EB001B"/>
    <circle cx="37" cy="7.5" r="4" fill="#FF5F00"/>
    <circle cx="48" cy="7.5" r="4" fill="#F79E1B"/>
    
    <!-- VNPay -->
    <rect x="60" y="0" width="25" height="15" rx="3" fill="#0066CC"/>
    <text x="72.5" y="10" text-anchor="middle" fill="white" font-size="5" font-family="Arial">VNPay</text>
    
    <!-- MoMo -->
    <rect x="90" y="0" width="25" height="15" rx="3" fill="#D82D8B"/>
    <text x="102.5" y="10" text-anchor="middle" fill="white" font-size="5" font-family="Arial">MoMo</text>
  </g>
  
  <!-- Security Elements -->
  <g transform="translate(230, 180)">
    <!-- Lock Icon -->
    <rect x="5" y="8" width="10" height="12" rx="2" fill="#10B981"/>
    <path d="M7 8 L7 5 C7 3 9 1 12 1 C15 1 17 3 17 5 L17 8" stroke="#10B981" stroke-width="1.5" fill="none"/>
    <circle cx="12" cy="14" r="1.5" fill="white"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="70" cy="200" r="3" fill="#10B981" opacity="0.3"/>
  <circle cx="240" cy="120" r="4" fill="#F59E0B" opacity="0.3"/>
  <circle cx="50" cy="150" r="2" fill="#2563EB" opacity="0.3"/>
  
  <!-- Success Checkmark -->
  <g transform="translate(180, 200)">
    <circle cx="15" cy="15" r="12" fill="#10B981" opacity="0.2"/>
    <path d="M8 15 L12 19 L22 9" stroke="#10B981" stroke-width="2" fill="none"/>
  </g>
</svg>
