<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D depth -->
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with gradient -->
  <circle cx="150" cy="150" r="140" fill="url(#phoneGradient)" stroke="#2563EB" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Phone Device with 3D effect -->
  <g id="phoneDevice" filter="url(#dropShadow)">
    <rect x="100" y="60" width="100" height="180" rx="15" fill="url(#phoneGradient)" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="105" y="75" width="90" height="150" rx="5" fill="url(#screenGradient)"/>
  </g>
  
  <!-- Screen Content -->
  <!-- Header -->
  <rect x="110" y="80" width="80" height="8" rx="4" fill="#2563EB"/>
  
  <!-- Search Form -->
  <rect x="110" y="95" width="35" height="15" rx="3" fill="#E5E7EB"/>
  <rect x="150" y="95" width="35" height="15" rx="3" fill="#E5E7EB"/>
  
  <!-- Date Picker -->
  <rect x="110" y="115" width="80" height="12" rx="2" fill="#F3F4F6"/>
  <circle cx="115" cy="121" r="2" fill="#2563EB"/>
  <rect x="125" y="119" width="20" height="4" rx="2" fill="#6B7280"/>
  
  <!-- Transport Options -->
  <circle cx="120" cy="140" r="8" fill="#2563EB"/>
  <path d="M116 140 L118 142 L124 136" stroke="white" stroke-width="2" fill="none"/>
  <rect x="135" y="135" width="50" height="10" rx="2" fill="#E5E7EB"/>
  
  <circle cx="120" cy="160" r="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="135" y="155" width="50" height="10" rx="2" fill="#F3F4F6"/>
  
  <circle cx="120" cy="180" r="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="135" y="175" width="50" height="10" rx="2" fill="#F3F4F6"/>
  
  <!-- Search Button -->
  <rect x="110" y="200" width="80" height="20" rx="10" fill="#2563EB"/>
  <text x="150" y="213" text-anchor="middle" fill="white" font-size="8" font-family="Arial">Tìm kiếm</text>
  
  <!-- Floating Elements with 3D layers -->
  <!-- Airplane (Layer 3 - Farthest) -->
  <g id="airplane" transform="translate(220, 80)" filter="url(#glow)">
    <path d="M0 10 L15 5 L20 0 L25 5 L15 10 L20 15 L15 20 L0 15 Z" fill="#2563EB" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate"
                      values="220,80; 225,75; 220,80" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Train (Layer 2 - Middle) -->
  <g id="train" transform="translate(50, 200)" filter="url(#dropShadow)">
    <rect x="0" y="5" width="30" height="10" rx="5" fill="#10B981" opacity="0.9"/>
    <circle cx="5" cy="17" r="3" fill="#10B981" opacity="0.9"/>
    <circle cx="25" cy="17" r="3" fill="#10B981" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate"
                      values="50,200; 45,205; 50,200" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Bus (Layer 1 - Closest) -->
  <g id="bus" transform="translate(230, 220)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="25" height="15" rx="3" fill="#F59E0B" opacity="0.9"/>
    <circle cx="5" cy="17" r="2" fill="#F59E0B" opacity="0.9"/>
    <circle cx="20" cy="17" r="2" fill="#F59E0B" opacity="0.9"/>
    <rect x="2" y="2" width="21" height="8" rx="1" fill="#FEF3C7"/>
    <animateTransform attributeName="transform" type="translate"
                      values="230,220; 235,215; 230,220" dur="2.5s" repeatCount="indefinite"/>
  </g>
  
  <!-- Decorative Dots -->
  <circle cx="70" cy="100" r="3" fill="#2563EB" opacity="0.3"/>
  <circle cx="240" cy="160" r="4" fill="#10B981" opacity="0.3"/>
  <circle cx="60" cy="250" r="2" fill="#F59E0B" opacity="0.3"/>
</svg>
